# Keepalive de Supabase (A6/D5.4): evita la pausa del plan gratuito tras ~7 días
# de inactividad. IMPORTANTE: la pausa la causa el Postgres en reposo, así que el
# ping debe tocar la base de datos, no solo el endpoint /auth/v1/health.
# Consulta mínima autenticada con la anon key (variable del repo, NUNCA service_role).
name: keepalive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a Postgres (anon key)
        run: |
          curl -fsS -o /dev/null -w "%{http_code}" \
            -X POST "${{ vars.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Profile: public" \
            -H "Prefer: count=none"
